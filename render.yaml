services:
  - type: web
    name: keylytics-web
    env: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENGINE_API_URL
        value: https://keylytics-engine.onrender.com
