<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylytics - Typing Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-theme="dark">
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-left">
                <h1>Keylytics</h1>
            </div>
            <div class="header-right">
                <div class="theme-selector">
                    <button class="theme-btn" data-theme="dark" title="Dark">
                        <span class="theme-dot dark"></span>
                    </button>
                    <button class="theme-btn" data-theme="light" title="Light">
                        <span class="theme-dot light"></span>
                    </button>
                    <button class="theme-btn" data-theme="ocean" title="Ocean">
                        <span class="theme-dot ocean"></span>
                    </button>
                    <button class="theme-btn" data-theme="forest" title="Forest">
                        <span class="theme-dot forest"></span>
                    </button>
                    <button class="theme-btn" data-theme="sunset" title="Sunset">
                        <span class="theme-dot sunset"></span>
                    </button>
                </div>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="random">Words</button>
                    <button class="mode-btn" data-mode="quote">Quotes</button>
                </div>
            </div>
        </header>

        <main>
            <!-- Typing Area -->
            <div id="typing-area" class="typing-area">
                <div class="text-container">
                    <div id="text-display" class="text-display"></div>
                    <textarea
                        id="typing-input"
                        class="typing-input"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        placeholder="Click here and start typing..."
                    ></textarea>
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <span class="stat-value" id="live-wpm">0</span>
                        <span class="stat-label">wpm</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="live-accuracy">100</span>
                        <span class="stat-label">acc%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="live-time">0</span>
                        <span class="stat-label">sec</span>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Results Panel -->
            <div id="results-panel" class="results-panel hidden">
                <div class="results-header">
                    <h2>Results</h2>
                    <button id="restart-btn" class="restart-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 4v6h6M23 20v-6h-6"/>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                        </svg>
                        Try Again
                    </button>
                </div>

                <div class="results-grid">
                    <!-- Main Stats -->
                    <div class="result-card large">
                        <div class="result-value" id="result-wpm">0</div>
                        <div class="result-label">WPM</div>
                    </div>
                    <div class="result-card large">
                        <div class="result-value" id="result-accuracy">0%</div>
                        <div class="result-label">Accuracy</div>
                    </div>

                    <!-- Secondary Stats -->
                    <div class="result-card">
                        <div class="result-value" id="result-duration">0s</div>
                        <div class="result-label">Time</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="result-chars">0</div>
                        <div class="result-label">Characters</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="result-corrections">0</div>
                        <div class="result-label">Corrections</div>
                    </div>
                    <div class="result-card">
                        <div class="result-value" id="result-latency">0ms</div>
                        <div class="result-label">Avg Latency</div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-section">
                    <div class="chart-container">
                        <h3>WPM Over Time</h3>
                        <canvas id="wpm-chart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h3>Key Latency</h3>
                        <canvas id="latency-chart"></canvas>
                    </div>
                </div>

                <!-- Insights -->
                <div class="insights-section">
                    <h3>Insights</h3>
                    <ul id="insights-list"></ul>
                </div>

                <!-- Details -->
                <div class="details-section">
                    <div class="detail-row">
                        <span class="detail-label">Hesitation Spikes</span>
                        <span class="detail-value" id="result-spikes">0</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Correction Bursts</span>
                        <span class="detail-value" id="result-bursts">0</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Slowest Bigrams</span>
                        <span class="detail-value" id="result-bigrams">-</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="shortcuts">
                <span><kbd>Tab</kbd> New text</span>
                <span><kbd>Esc</kbd> Restart</span>
            </div>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
